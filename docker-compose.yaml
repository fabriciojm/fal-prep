services:
  laf-api:
    image: ghcr.io/fabriciojm/laf-api:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      INFERENCE_SERVICE_URL: "http://guama:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
